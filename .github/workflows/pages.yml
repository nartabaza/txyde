# Builds site/ and publishes it to GitHub Pages on every push to main.
# The preview is served from https://<user>.github.io/<repo>/, so links get the
# repo name as a base path; analytics are off and search engines are told not to index.
name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      HAS_AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Smaller copies of the photos (see site/README.md). They are uploaded only when AWS
      # access is set up, and an upload problem never blocks the deploy: the build then
      # uses whichever copies are already live, and the originals for the rest.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore downloaded originals and copies
        uses: actions/cache@v4
        with:
          path: site/images
          key: images-${{ hashFiles('site/src/categories/*.json', 'site/scripts/make_images.py') }}
          restore-keys: images-
      - name: AWS access (role, no stored key)
        if: vars.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-north-1
      - name: AWS access (access key)
        if: vars.AWS_ROLE_ARN == '' && env.HAS_AWS_KEY == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1
      - name: Make photo copies
        working-directory: site
        run: |
          pip install -q Pillow boto3
          python scripts/make_images.py
      - name: Upload photo copies
        if: env.AWS_ACCESS_KEY_ID != ''
        continue-on-error: true
        working-directory: site
        run: python scripts/make_images.py --upload
      - name: Record live copies
        working-directory: site
        run: python scripts/make_images.py --check

      - name: Build
        working-directory: site
        run: node build.js
        env:
          BASE_PATH: /${{ github.event.repository.name }}
          PREVIEW: 1
          GATE_PASSWORD_HASH: ${{ vars.GATE_PASSWORD_HASH }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
      - id: deployment
        uses: actions/deploy-pages@v4
