# Builds the live site and uploads it to GoDaddy (cPanel hosting) over FTP after every push to main.
# See "Deploying to GoDaddy" in site/README.md for the one-time setup (FTP account and secrets).
#
# It waits for the "Deploy preview to GitHub Pages" workflow to finish first: that one makes and
# uploads the smaller photo copies, and this build needs to see them as live.
# gate.json is never uploaded, so the live password is only ever changed by hand (see README).
name: Deploy to GoDaddy

on:
  workflow_run:
    workflows: ["Deploy preview to GitHub Pages"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godaddy
  cancel-in-progress: false

jobs:
  deploy:
    # Run after a successful preview deploy, or when started by hand.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Record which photo copies are live (read only, no AWS access needed) so the build links them.
      - name: Record live photo copies
        working-directory: site
        run: |
          pip install -q Pillow boto3
          python scripts/make_images.py --check

      # No BASE_PATH and no PREVIEW: root links, analytics on.
      - name: Build
        working-directory: site
        run: node build.js

      - name: Upload to GoDaddy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: site/dist/
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
          exclude: |
            **/.git*
            **/.git*/**
            gate.json
