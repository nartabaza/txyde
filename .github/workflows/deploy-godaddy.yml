# Builds the live site and uploads it to GoDaddy (cPanel hosting) over SFTP after every push to main.
# See "Deploying to GoDaddy" in site/README.md for the one-time setup (SSH key and variables).
#
# It waits for the "Deploy preview to GitHub Pages" workflow to finish first: that one makes and
# uploads the smaller photo copies, and this build needs to see them as live.
# gate.json is never uploaded, so the live password is only ever changed by hand (see README).
name: Deploy to GoDaddy

on:
  workflow_run:
    workflows: ["Deploy preview to GitHub Pages"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godaddy
  cancel-in-progress: false

jobs:
  deploy:
    # Run after a successful preview deploy, or when started by hand.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Record which photo copies are live (read only, no AWS access needed) so the build links them.
      - name: Record live photo copies
        working-directory: site
        run: |
          pip install -q Pillow boto3
          python scripts/make_images.py --check

      # No BASE_PATH and no PREVIEW: root links, analytics on.
      - name: Build
        working-directory: site
        run: node build.js

      # SFTP over SSH (the account has file access but no shell, so rsync cannot run). The server's
      # fingerprint is pinned (SSH_KNOWN_HOSTS), so the key is only ever offered to the real server.
      # Nothing is deleted on the server, and gate.json is never touched. The whole site is a few
      # hundred KB, so every file newer than the server's copy is simply sent again.
      - name: Upload to GoDaddy
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER }}
          SSH_REMOTE_DIR: ${{ vars.SSH_REMOTE_DIR }}
        run: |
          sudo apt-get install -y -q lftp
          install -m 700 -d ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          lftp -u "$SSH_USER,x" -e "set sftp:connect-program 'ssh -a -x -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes'; set cmd:fail-exit yes; mirror -R --no-perms --verbose --exclude gate.json site/dist $SSH_REMOTE_DIR; bye" "sftp://$SSH_HOST"
