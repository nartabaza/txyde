# Branch preview for review (lives on this branch only; remove it before merging into main).
# Publishes to the same GitHub Pages site as pages.yml:
#   https://<user>.github.io/<repo>/          main, rebuilt unchanged so the team preview stays as it is
#   https://<user>.github.io/<repo>/preview/  this branch
# The next push to main redeploys main alone, which removes /preview/. Re-run this workflow to bring it back.
name: Deploy branch preview to GitHub Pages

on:
  push:
    branches: [claude/static-site-image-scalability-626gc9, ccr-a871528c-u5c9ra]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}preview/
    env:
      HAS_AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
    steps:
      - name: Check out this branch
        uses: actions/checkout@v4
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-src
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build main
        working-directory: main-src/site
        run: node build.js
        env:
          BASE_PATH: /${{ github.event.repository.name }}
          PREVIEW: 1
          GATE_PASSWORD_HASH: ${{ vars.GATE_PASSWORD_HASH }}
      # Photo copies for this branch's build: same steps as pages.yml.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore downloaded originals and copies
        uses: actions/cache@v4
        with:
          path: site/images
          key: images-${{ hashFiles('site/src/categories/*.json', 'site/scripts/make_images.py') }}
          restore-keys: images-
      - name: AWS access (role, no stored key)
        if: vars.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-north-1
      - name: AWS access (access key)
        if: vars.AWS_ROLE_ARN == '' && env.HAS_AWS_KEY == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1
      - name: Make photo copies
        working-directory: site
        run: |
          pip install -q Pillow boto3
          python scripts/make_images.py
      - name: Upload photo copies
        if: env.AWS_ACCESS_KEY_ID != ''
        continue-on-error: true
        working-directory: site
        run: python scripts/make_images.py --upload
      - name: Record live copies
        working-directory: site
        run: python scripts/make_images.py --check

      - name: Build this branch
        working-directory: site
        run: node build.js
        env:
          BASE_PATH: /${{ github.event.repository.name }}/preview
          PREVIEW: 1
          GATE_PASSWORD_HASH: ${{ vars.GATE_PASSWORD_HASH }}
      - name: Combine
        run: |
          mkdir -p out
          cp -r main-src/site/dist/. out/
          mkdir -p out/preview
          cp -r site/dist/. out/preview/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - id: deployment
        uses: actions/deploy-pages@v4
